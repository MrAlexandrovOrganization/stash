version: v2
inputs:
 - directory: proto
   paths: [proto/whisper/whisper.proto, proto/processing/processing.proto]
 - directory: proto/embed
plugins:
 - local: protoc-gen-go
   out: .
   opt: module=stash
 - local: protoc-gen-go-grpc
   out: .
   opt: [module=stash, require_unimplemented_servers=false]
