services:
  stash:
    build: .
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      POSTGRES_URL: "postgres://stash:stash@postgres:5432/stash?sslmode=disable"
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY}"
      WHISPER_HOST: "${WHISPER_HOST:-}"
      WHISPER_PORT: "${WHISPER_PORT:-50053}"
      # Hardcoded so a stray empty OLLAMA_URL in .env cannot silently disable
      # the vision provider. Override here only if Ollama lives elsewhere.
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5vl:3b}"
      # Text-embedding model for descriptions. Must match an exact Ollama tag
      # (Ollama 0.30.5 rejects a bare `bge-m3` when the pull is tagged bge-m3:567m).
      OLLAMA_EMBED_MODEL: "${OLLAMA_EMBED_MODEL:-bge-m3:567m}"
      AI_DESCRIPTION_BACKFILL_INTERVAL: "${AI_DESCRIPTION_BACKFILL_INTERVAL:-5m}"
      AI_DESCRIPTION_BACKFILL_BATCH: "${AI_DESCRIPTION_BACKFILL_BATCH:-5}"
      EMBEDDING_BACKFILL_INTERVAL: "${EMBEDDING_BACKFILL_INTERVAL:-5m}"
      EMBEDDING_BACKFILL_BATCH: "${EMBEDDING_BACKFILL_BATCH:-5}"
      # Embedding microservice (gRPC). Leave empty to disable image embeddings.
      CLIP_EMBEDDER_ADDR: "${CLIP_EMBEDDER_ADDR:-clip-embedder:50051}"
      OTEL_SERVICE_NAME: "stash"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stash-net
      - stash-api-net
      - minio-net
      - whisper-net
      - ollama-net
      - clip-net
      - jaeger-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: stash
      POSTGRES_PASSWORD: stash
      POSTGRES_DB: stash
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stash"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - stash-net
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"

networks:
  stash-net:
  stash-api-net:
    name: stash-api-net
  minio-net:
    external: true
    name: minio-net
  whisper-net:
    external: true
    name: whisper-net
  ollama-net:
    external: true
    name: ollama-net
  # Created by the clip-embedder repo's own docker-compose; stash joins it.
  clip-net:
    external: true
    name: clip-net
  jaeger-net:
    external: true
    name: jaeger-net

volumes:
  postgres-data:
