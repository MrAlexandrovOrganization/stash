services:
  worker-cpu:
    container_name: "${CONTAINER_NAME_PREFIX:-}stash-worker-cpu"
    user: ${WORKER_UID:-1000}:${WORKER_GID:-1000}
    image: ${WORKER_CPU_IMAGE:-ghcr.io/mralexandrovorganization/stash-worker-cpu:bootstrap}
    entrypoint: [/app/stash-worker]
    healthcheck:
      test: [CMD-SHELL, test -f /tmp/worker-ready]
      interval: 20s
      timeout: 5s
      start_period: 5m
      retries: 3
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      WORKER_ENDPOINT: ${WORKER_ENDPOINT:?Set TLS endpoint}
      WORKER_TRANSPORT: tls
      WORKER_ID: ${CPU_WORKER_ID:?Set worker identity}
      WORKER_TOKEN_FILE: /run/secrets/worker-token
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5vl:3b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-bge-m3:567m}
    secrets: [worker-token]
    depends_on: [ollama]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    deploy:
      resources:
        limits: {memory: "${WORKER_MEMORY_LIMIT:-512m}", cpus: "${WORKER_CPU_LIMIT:-0.5}"}
  ollama:
    container_name: "${CONTAINER_NAME_PREFIX:-}stash-worker-ollama"
    image: ollama/ollama:${OLLAMA_VERSION:?Run via make}
    restart: unless-stopped
    volumes: [ollama-data:/root/.ollama]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    deploy:
      resources:
        limits:
          memory: ${OLLAMA_MEMORY_LIMIT:-6g}
          cpus: ${OLLAMA_CPU_LIMIT:-2}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
secrets:
  worker-token:
    file: ${CPU_WORKER_TOKEN_PATH:?Set worker token path}
volumes:
  ollama-data:
