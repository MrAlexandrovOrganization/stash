name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      PROTO_BREAKING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make install
      - run: make check build
      - run: make ENV_FILE=.env.server.example config-check
      - run: make ENV_FILE=.env.mac.example config-check
      - run: make ENV_FILE=.env.wsl.example config-check

  workers:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make publish-workers PUBLISH_ARCH=${{ matrix.arch }}

  deploy:
    needs: [check, workers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - id: server
        run: make -s server-image >> "$GITHUB_OUTPUT"
      - uses: appleboy/ssh-action@v1.2.2
        env:
          SERVER_IMAGE: ${{ steps.server.outputs.server_image }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          command_timeout: 40m
          envs: SERVER_IMAGE,DEPLOY_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -eu
            cd /home/maxim/projects/backends/stash
            test -z "$(git status --porcelain)"
            git fetch --quiet origin refs/heads/main
            test "$(git rev-parse FETCH_HEAD)" = "$DEPLOY_SHA"
            git merge --ff-only --quiet "$DEPLOY_SHA"
            python3 -c 'import json,os; print(json.dumps({"revision":os.environ["DEPLOY_SHA"],"image":os.environ["SERVER_IMAGE"],"user":os.environ["GHCR_USER"],"token":os.environ["GHCR_TOKEN"]}))' | ssh -T -o BatchMode=yes -i /home/maxim/.ssh/stash-wsl-deploy maxim@100.64.0.3

  approve:
    needs: [workers, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make promote-workers
